[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tenrai-wallet-daemon-client"
version = "0.1.0"
description = "Python client for the Tenrai wallet daemon, with exchange and merchant examples"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tenrai_daemon = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["tenrai_daemon", "examples"]
